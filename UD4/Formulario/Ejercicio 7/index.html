<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 7 - Reseña de Producto</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <form class="card" method="post">
      <h2>Reseña de producto</h2>

      <label for="producto">Nombre del Producto</label><br>
      <input type="text" id="producto" name="producto" value="Producto de ejemplo" readonly/><br><br>

      <span>Puntuación</span><br>
      <div class="rating">
        <input type="radio" id="star5" name="puntuacion" value="5" />
        <label for="star5">★</label>
        <input type="radio" id="star4" name="puntuacion" value="4" />
        <label for="star4">★</label>
        <input type="radio" id="star3" name="puntuacion" value="3" />
        <label for="star3">★</label>
        <input type="radio" id="star2" name="puntuacion" value="2" />
        <label for="star2">★</label>
        <input type="radio" id="star1" name="puntuacion" value="1" />
        <label for="star1">★</label>
      </div>
      <br>

      <label for="comentario">Comentario</label><br>
      <textarea id="comentario" name="comentario" rows="4" cols="40" placeholder="Cuéntanos tu experiencia con el producto..."></textarea>
      <br><br>

      <div class="recomendacion">
        <input type="checkbox" id="recomendar" name="recomendar" />
        <label for="recomendar">¿Recomendarías este producto?</label>
      </div>
      <br />

      <input type="submit" value="Enviar reseña" />
    </form>
  </body>
</html>
